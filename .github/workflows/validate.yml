name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check SKILL.md frontmatter
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = p.read_text()
              if not text.startswith("---"):
                  print(f"{p}: missing frontmatter"); bad += 1; continue
              fm = yaml.safe_load(text.split("---", 2)[1])
              name, desc = fm.get("name"), fm.get("description")
              if name != p.parent.name:
                  print(f"{p}: name '{name}' != folder '{p.parent.name}'"); bad += 1
              if not desc or len(desc) > 1024:
                  print(f"{p}: description missing or longer than 1024 chars"); bad += 1
              print(f"ok {p}")
          for e in sorted(pathlib.Path("evals").glob("*.json")):
              import json
              if json.loads(e.read_text()).get("skill_name") != e.stem:
                  print(f"{e}: skill_name != {e.stem}"); bad += 1
          sys.exit(1 if bad else 0)
          PY

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n + shellcheck
        run: |
          for f in skills/*/scripts/*.sh; do bash -n "$f"; done
          shellcheck skills/*/scripts/*.sh
      - name: py_compile
        run: python3 -m py_compile skills/*/scripts/*.py

  tlc-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch tla2tools.jar
        run: bash skills/prove/scripts/check_toolchain.sh --fetch-tla2tools
      - name: Fixed model passes, buggy model fails
        working-directory: skills/prove/assets
        run: |
          JAR="$HOME/.cache/vflow/tla2tools.jar"
          META="${RUNNER_TEMP:-/tmp}/tlc-meta"
          java -XX:+UseParallelGC -cp "$JAR" tlc2.TLC -workers 1 -metadir "$META/fixed" -config MessageDeliveryFixed.cfg MessageDelivery.tla
          if java -XX:+UseParallelGC -cp "$JAR" tlc2.TLC -workers 1 -metadir "$META/buggy" -config MessageDelivery.cfg MessageDelivery.tla > "$META/buggy.out" 2>&1; then
            cat "$META/buggy.out"; echo "expected the buggy config to violate an invariant"; exit 1
          fi
          grep -q "Invariant DeliveryReportWins is violated" "$META/buggy.out" || { cat "$META/buggy.out"; echo "buggy config failed for the wrong reason"; exit 1; }
      - name: Fallback statechart renders
        run: |
          A=skills/prove/assets
          bash skills/prove/scripts/tlc.sh $A/MessageDelivery.tla -c $A/MessageDeliveryFixed.cfg -o "$RUNNER_TEMP/out" --dot
          python3 skills/prove/scripts/dot2mermaid.py "$RUNNER_TEMP/out/states.dot" --vars status --words $A/MessageDelivery.words.json > "$RUNNER_TEMP/chart.mmd"
          grep -q '^stateDiagram-v2' "$RUNNER_TEMP/chart.mmd" && cat "$RUNNER_TEMP/chart.mmd"
